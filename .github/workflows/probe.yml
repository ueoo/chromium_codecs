name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          df -h /System/Volumes/Data
          time xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          xcrun -f metal && xcrun metal --version | head -1
          df -h /System/Volumes/Data
          sudo du -xsh /Applications/* /Users/runner/* /Users/runner/.[a-z]* /Users/runner/Library/* /Library/* /Library/Developer/* /usr/local/* /opt/* /opt/homebrew/* /private/var/* 2>/dev/null | sort -h | tail -45
